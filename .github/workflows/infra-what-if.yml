name: Infrastructure what-if

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-what-if.yml"

concurrency:
  group: what-if-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  what-if:
    name: What-if (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            resource-group: rg-collage-studio-dev
            parameter-file: infra/dev.bicepparam
          - environment: prod
            resource-group: rg-collage-studio-prod
            parameter-file: infra/prod.bicepparam
    steps:
      - uses: actions/checkout@v7

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run what-if
        id: whatif
        env:
          RESOURCE_GROUP: ${{ matrix.resource-group }}
          PARAMETER_FILE: ${{ matrix.parameter-file }}
          APP_VERSION: ${{ github.sha }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters "$PARAMETER_FILE" \
            --parameters appVersion="$APP_VERSION" \
            --no-pretty-print > what-if.json

          {
            echo "<!-- what-if:${ENVIRONMENT} -->"
            echo "### What-if · \`${ENVIRONMENT}\`"
            echo
            # appVersion carries the commit sha, so the site always reports a
            # Modify. Only the other resources say something about this change.
            jq -r '
              [.changes[] | select(.changeType != "NoChange" and .changeType != "Ignore")] as $changes
              | if ($changes | length) == 0 then
                  "No infrastructure changes."
                else
                  "| Change | Resource |\n| --- | --- |\n"
                  + ([$changes[] | "| `\(.changeType)` | `\(.resourceId | split("/") | .[-2:] | join("/"))` |"] | join("\n"))
                end
            ' what-if.json
            echo
            echo "<details><summary>Property level diff</summary>"
            echo
            echo '```json'
            jq '[.changes[] | select(.changeType != "NoChange" and .changeType != "Ignore") | {changeType, resourceId, delta}]' what-if.json
            echo '```'
            echo
            echo "</details>"
          } > comment.md

          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the plan on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ matrix.environment }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker="<!-- what-if:${ENVIRONMENT} -->"
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"${marker}\")) | .id] | first // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -F body=@comment.md > /dev/null
            echo "Updated comment ${existing}"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F body=@comment.md > /dev/null
            echo "Created a new comment"
          fi
