name: Mobile release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: EAS build profile
        type: choice
        options: [development, preview, production]
        default: preview
      submit:
        description: Submit the build to the store after it finishes
        type: boolean
        default: false

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: EAS build (${{ inputs.platform }} · ${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.profile == 'production' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v7

      - name: Require an Expo access token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::Set the EXPO_TOKEN secret (expo.dev > Account settings > Access tokens) before running this workflow."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build shared engine
        run: npm run build:core

      - name: Typecheck mobile app
        run: npm run typecheck -w @collage/mobile

      - name: Trigger EAS build
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          args=(build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --non-interactive)
          if [ "${{ inputs.submit }}" = "true" ]; then
            args+=(--auto-submit)
          fi
          eas "${args[@]}"
