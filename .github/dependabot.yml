version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      expo:
        patterns:
          - expo
          - "expo-*"
          - react-native
          - "react-native-*"
      tooling:
        patterns:
          - eslint
          - "eslint-*"
          - "@typescript-eslint/*"
          - typescript-eslint
          - prettier
          - typescript
          - vite
          - vitest
          - "@vitejs/*"
          - "@vitest/*"
    ignore:
      # The Expo SDK pins its own React and React Native versions, so these are
      # upgraded as one coordinated release and never as a dependency bump.
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: react-native-*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
